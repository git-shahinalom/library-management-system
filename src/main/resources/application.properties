# Default profile - used for local development on your own laptop.
# When deploying, the docker/production settings in application-docker.properties
# are used instead (see docker-compose.yml which sets SPRING_PROFILES_ACTIVE=docker).

spring.application.name=library-management-system

# --- Local MySQL (edit for your own machine when developing locally) ---
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
