# Active when SPRING_PROFILES_ACTIVE=docker (set in docker-compose.yml).
# Values come from environment variables so the password is never hardcoded
# or committed to GitHub - see the .env file on the VM (not in git).

spring.application.name=library-management-system

spring.datasource.url=jdbc:mysql://${DB_HOST:192.168.88.252}:${DB_PORT:3306}/${DB_NAME:library_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:library_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
