<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Member - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments :: sidebar('members')}"></div>

    <div class="main">
        <h2>Add a member</h2>
        <p class="subhead">Register a student or a teacher</p>

        <div class="card">
            <h3 style="margin-top:0; font-size:1.05rem;">Student</h3>
            <form method="post" action="/members/student" class="form-grid">
                <div class="field">
                    <label for="s_name">Full name</label>
                    <input type="text" id="s_name" name="name" required>
                </div>
                <div class="field">
                    <label for="s_email">Email</label>
                    <input type="email" id="s_email" name="email" required>
                </div>
                <div class="field">
                    <label for="s_phone">Phone</label>
                    <input type="text" id="s_phone" name="phone">
                </div>
                <div class="field">
                    <label for="s_id">Student ID</label>
                    <input type="text" id="s_id" name="studentId" required>
                </div>
                <div class="field">
                    <label for="s_dept">Department</label>
                    <input type="text" id="s_dept" name="department">
                </div>
                <div class="field">
                    <label for="s_username">Login username</label>
                    <input type="text" id="s_username" name="username" required>
                </div>
                <div class="field">
                    <label for="s_password">Login password</label>
                    <input type="password" id="s_password" name="password" required>
                </div>
                <div style="align-self:end;">
                    <button class="btn" type="submit">Add student</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h3 style="margin-top:0; font-size:1.05rem;">Teacher</h3>
            <form method="post" action="/members/teacher" class="form-grid">
                <div class="field">
                    <label for="t_name">Full name</label>
                    <input type="text" id="t_name" name="name" required>
                </div>
                <div class="field">
                    <label for="t_email">Email</label>
                    <input type="email" id="t_email" name="email" required>
                </div>
                <div class="field">
                    <label for="t_phone">Phone</label>
                    <input type="text" id="t_phone" name="phone">
                </div>
                <div class="field">
                    <label for="t_id">Employee ID</label>
                    <input type="text" id="t_id" name="employeeId" required>
                </div>
                <div class="field">
                    <label for="t_dept">Department</label>
                    <input type="text" id="t_dept" name="department">
                </div>
                <div class="field">
                    <label for="t_username">Login username</label>
                    <input type="text" id="t_username" name="username" required>
                </div>
                <div class="field">
                    <label for="t_password">Login password</label>
                    <input type="password" id="t_password" name="password" required>
                </div>
                <div style="align-self:end;">
                    <button class="btn" type="submit">Add teacher</button>
                </div>
            </form>
        </div>

        <a class="btn btn-secondary" href="/members">Back to members</a>
    </div>
</div>
</body>
</html>
