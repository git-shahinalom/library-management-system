<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Book - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments :: sidebar('books')}"></div>

    <div class="main">
        <h2>Add a book</h2>
        <p class="subhead">Add a new title to the catalogue</p>

        <div class="card">
            <form method="post" action="/books" class="form-grid single">
                <div class="field">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="field">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" required>
                </div>
                <div class="field">
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" name="isbn" required>
                </div>
                <div class="field">
                    <label for="totalCopies">Number of copies</label>
                    <input type="number" id="totalCopies" name="totalCopies" min="1" value="1" required>
                </div>
                <div>
                    <button class="btn" type="submit">Save book</button>
                    <a class="btn btn-secondary" href="/books">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
